:root{--bg:#fff;--card:#fff;--ink:#1F2A37;--rule:#C9CED6;--line:#DDE1E6;--text:#1F2A37;--muted:#5E6875;--volt:#2F64A8;--amp:#B86A28;--temp:#7556A8;--ok:#178A4C;--okSoft:#EAF5EE;--warn:#8A5A00;--warnSoft:#FBF1DE;--danger:#C42F24;--dangerSoft:#FBEAE8;--blue:#1F5FA8;--ampCell:#F7E6D8;--voltCell:#E3EBF6;--sans:'IBM Plex Sans Condensed',system-ui,sans-serif;--mono:'IBM Plex Sans Condensed',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:#fff;color:var(--text);font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}

.tabs.many button{font-size:15px;gap:5px}.tabs.many .sim{font-size:10px}
@media (max-width:370px){.tabs.many button{font-size:13px;gap:3px;padding:0 1px}.tabs.many .dot{width:6px;height:6px}.tabs.many .sim{font-size:9px;letter-spacing:0}}

<body>

<section id="loginView" class="login hidden">
  <h1>MCS Suivi</h1>
  <p>Connexion une seule fois sur ce téléphone, avec le compte créé dans Firebase.</p>
  <form id="loginForm" method="post" action="#">
    <label for="email">Adresse mail</label>
    <input id="email" name="username" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" required>
    <label for="pass">Mot de passe</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>

<script>
const CFG = {
  apiKey: "AIzaSyD9wWBauLRixFVOsr8pLYfp-joWpVWfqts",
  db: "https://mcs-atelier-default-rtdb.europe-west1.firebasedatabase.app",
  idt: "https://identitytoolkit.googleapis.com", sec: "https://securetoken.googleapis.com"
};
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
};
let idToken = null, tokenUntil = 0, timer = null, machines = {}, pending = {};

// ---------- connexion (REST Firebase Auth) ----------
async function signIn(email, password){
  const r = await fetch(CFG.idt + "/v1/accounts:signInWithPassword?key=" + CFG.apiKey, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ email, password, returnSecureToken:true })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error && j.error.message || "Connexion refusée");
  idToken = j.idToken; tokenUntil = Date.now() + (parseInt(j.expiresIn)||3600)*1000 - 120000;
  store.set("mcs_refresh", j.refreshToken);
}
async function ensureToken(){
  if (idToken && Date.now() < tokenUntil) return;
  const rt = store.get("mcs_refresh");
  if (!rt) throw new Error("NOLOGIN");
  const r = await fetch(CFG.sec + "/v1/token?key=" + CFG.apiKey, {
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rt)
  });
  const j = await r.json();
  if (!r.ok) { store.set("mcs_refresh", null); throw new Error("NOLOGIN"); }
  idToken = j.id_token; tokenUntil = Date.now() + (parseInt(j.expires_in)||3600)*1000 - 120000;
  store.set("mcs_refresh", j.refresh_token);
}
async function dbGet(path){
  await ensureToken();
  const r = await fetch(CFG.db + "/" + path + ".json?auth=" + encodeURIComponent(idToken));
  if (r.status === 401) { idToken = null; throw new Error("Accès refusé"); }
  if (!r.ok) throw new Error("Erreur " + r.status);
  return r.json();
}
async function dbPut(path, value){
  await ensureToken();
  const r = await fetch(CFG.db + "/" + path + ".json?auth=" + encodeURIComponent(idToken), {
    method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(value)
  });
  if (!r.ok) throw new Error("Erreur " + r.status);
}

function friendly(msg){
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(msg)) return "Adresse ou mot de passe incorrect.";
  if (/TOO_MANY_ATTEMPTS/.test(msg)) return "Trop d'essais. Réessayez dans quelques minutes.";
  if (/Failed to fetch|NetworkError|Load failed/.test(msg)) return "Pas de connexion Internet.";
  return msg;
}

// ---------- écrans ----------
let loginFormHome = null, loginFormEl = null;
function showLogin(){
  if (!loginFormEl) loginFormEl = $("loginForm");
  if (loginFormHome && !loginFormEl.isConnected) { loginFormEl.querySelector("#pass").value = ""; loginFormHome.appendChild(loginFormEl); }
  $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden"); clearInterval(timer); timer = null; closeStream(); }
function showApp(){
  $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
  refresh(); loadHist(); openStream();
  // Filet de sécurité : relecture complète toutes les 30 s, graphes toutes les 60 s ; l'affichage vit surtout du flux en direct
  if (!timer) { timer = setInterval(() => { if (document.hidden) return; refresh(); if (++tick % 2 === 0) loadHist(); }, 30000); }
}
setInterval(() => { if (timer) scheduleRender(); }, 5000);
let tick = 0, es = null, esTimer = null, hists = {}, renderPending = false;
// Flux en direct Firebase (Server-Sent Events) : chaque envoi du PC (toutes les 5 s) arrive aussitôt
async function openStream(){
  closeStream();
  if (document.hidden) return;   // jamais de flux en arrière-plan
  try { await ensureToken(); } catch(e){ if (e.message === "NOLOGIN") showLogin(); return; }
  es = new EventSource(CFG.db + "/state.json?auth=" + encodeURIComponent(idToken));
  const onData = (e, merge) => {
    let d; try { d = JSON.parse(e.data); } catch(x){ return; }
    applyAt(d.path, d.data, merge); noteRx(); scheduleRender();
  };
  es.addEventListener("put", e => onData(e, false));
  es.addEventListener("patch", e => onData(e, true));
  es.addEventListener("auth_revoked", () => { idToken = null; openStream(); });
  es.addEventListener("cancel", () => { closeStream(); });
  es.onerror = () => { closeStream(); clearTimeout(esTimer); esTimer = setTimeout(openStream, 5000); };
  // Jeton valable 1 h : on rouvre le flux avec un jeton neuf avant qu'il expire
  clearTimeout(esTimer); esTimer = setTimeout(() => { idToken = null; openStream(); }, Math.max(60000, tokenUntil - Date.now()));
}
function closeStream(){ if (es) { es.close(); es = null; } }
function applyAt(path, data, merge){
  const parts = (path || "/").split("/").filter(Boolean);
  if (!parts.length) { machines = merge ? Object.assign(machines, data || {}) : (data || {}); return; }
  let o = machines;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (data == null) delete o[last];
  else if (merge && typeof o[last] === "object") Object.assign(o[last], data);
  else o[last] = data;
}
// Doigt posé sur le graphique : la page n'est pas reconstruite (sinon le graphique touché est remplacé et le curseur
// ne suit plus le doigt au bout de quelques secondes, constaté le 26/11/2026) ; mise à jour dès que le doigt est levé
let touching = false, renderWaiting = false;
function scheduleRender(){ if (touching) { renderWaiting = true; return; } if (renderPending) return; renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); }
async function loadHist(){ try { hists = await dbGet("hist") || {}; scheduleRender(); } catch(e){} }

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("loginBtn"), errEl = $("loginErr");   // références gardées : le formulaire peut sortir du DOM
  errEl.textContent = ""; btn.disabled = true; btn.textContent = "Connexion…";
  try {
    await signIn($("email").value.trim(), $("pass").value);
    // Trousseau iOS : Safari propose d'enregistrer quand le formulaire disparaît
    // après une connexion réussie, avec les champs encore remplis. On le retire
    // du DOM, puis on le remet vidé plus tard.
    const f = $("loginForm"), p = $("pass");
    loginFormEl = f; loginFormHome = f.parentNode; f.remove();
    showApp();
    setTimeout(() => { p.value = ""; }, 4000);
  }
  catch(err){ errEl.textContent = friendly(err.message); }
  finally { btn.disabled = false; btn.textContent = "Se connecter"; }
});
$("logoutBtn").addEventListener("click", () => { if (confirm("Se déconnecter de ce téléphone ?")) { store.set("mcs_refresh", null); idToken = null; showLogin(); } });
// Appli réduite : flux en direct coupé tout de suite (aucune consommation Firebase en arrière-plan), rouvert au retour
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { closeStream(); clearTimeout(esTimer); return; }
  // Retour au premier plan : fraîcheur remise à « connexion… » le temps du premier envoi (pas de faux « reçu il y a 10 min »)
  pageStart = Date.now(); rxAt = {}; rxUpd = {}; lastRxAny = 0;
  if (timer) { refresh(); loadHist(); if (!es) openStream(); }
});

// ---------- affichage ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (x, d) => x == null ? "–" : Number(x).toLocaleString("fr-FR", { minimumFractionDigits:d, maximumFractionDigits:d });
function stateStyle(m){
  const s = m.state || "";
  if (s === "En marche") return ["var(--ok)","var(--okSoft)","var(--ok)"];
  if (s === "En pause") return ["var(--warn)","var(--warnSoft)","var(--warn)"];
  if (s.startsWith("Réveil")) return ["var(--blue)","#E7EEF7","var(--blue)"];
  if (s === "Terminé") return ["var(--ok)","var(--okSoft)","var(--ok)"];
  if (s.includes("erreur")) return ["var(--danger)","var(--dangerSoft)","var(--danger)"];
  if (s === "Hors ligne") return ["var(--warn)","var(--warnSoft)","var(--warn)"];
  return ["var(--muted)","#EEF1F5","var(--muted)"];
}

async function refresh(){
  try {
    dbGet("config/seuils").then(t => { if (t && t.hg) { TH = { hg: +t.hg, hr: +t.hr, ht: +t.ht }; scheduleRender(); } }).catch(() => {});
    const data = await dbGet("state") || {};
    machines = data; netDown = false;
    noteRx(); render();
  } catch(err){
    if (err.message === "NOLOGIN") { showLogin(); return; }
    $("upd").textContent = "⚠ " + friendly(err.message); $("upd").classList.remove("hidden");
  }
}

let selected = store.get("mcs_sel"), seenHistAt = {}, histLoading = false;
function render(){
  if (touching) { renderWaiting = true; return; }
  // Écran Rapports ouvert : le suivi du mail y est recopié
  for (const k in pending) if (k === (modalCtx && modalCtx.key) && modalCtx.fromRap) rapNote(pending[k]);
  // Le PC signale un nouveau graphe (changement d'étape, fin de cycle, ou toutes les 60 s) : on le recharge aussitôt
  for (const k in machines) {
    const ha = machines[k] && machines[k].histAt;
    if (ha && ha !== seenHistAt[k]) { seenHistAt[k] = ha; if (!histLoading) { histLoading = true; setTimeout(() => { histLoading = false; loadHist(); }, 800); } }
  }
  const now = Date.now();
  // Simulateur fermé depuis plus de 10 min : son onglet disparaît s'il y a de vraies machines (26/11 : 4 onglets débordaient)
  const anyReal = Object.keys(machines).some(k => machines[k] && typeof machines[k] === "object" && !machines[k].sim);
  const keys = Object.keys(machines).filter(k => machines[k] && typeof machines[k] === "object"
    && !(anyReal && machines[k].sim && now - (machines[k].updated || 0) > 600000));
  // Atelier (vraies machines) d'abord ; le simulateur après. Chaque machine juge sa propre fraîcheur.
  keys.sort((a, b) => (machines[a].sim ? 1 : 0) - (machines[b].sim ? 1 : 0) || a.localeCompare(b));
  const real = keys.filter(k => !machines[k].sim);
  const freshest = real.length ? Math.min(...real.map(k => rxAge(machines[k]))) : 0;
  const stale = real.length > 0 && (netDown || freshest > STALE_MS);
  if (!keys.length) {
    $("tabs").classList.add("hidden"); $("single").classList.add("hidden");
    $("list").innerHTML = '<div class="empty">Aucune machine reçue pour l\'instant.<br>Vérifiez dans MCS Studio : Réglages › Suivi téléphone.</div>'; return;
  }
  // Machine affichée : celle choisie (mémorisée sur le téléphone), sinon la première en marche, sinon la première
  if (!selected || !machines[selected] || !keys.includes(selected)) {
    selected = keys.find(k => !machines[k].sim && (machines[k].running || machines[k].paused)) || keys[0];
  }
  const tabs = $("tabs");
  tabs.classList.toggle("hidden", keys.length < 2);
  tabs.classList.toggle("many", keys.length > 2);
  tabs.innerHTML = keys.map(k => {
    const m = machines[k], dot = stateStyle(m)[2];
    const short = (m.name || k).replace(/ · simulateur$/, "").replace(/^MCS /, "");
    return '<button data-sel="'+esc(k)+'" class="'+(k===selected?'on':'')+'"><span class="dot" style="background:'+dot+'"></span>'+(keys.length > 2 ? '' : 'MCS ')+esc(short)+(m.sim?' <span class="sim">SIM</span>':'')+'</button>';
  }).join("");
  tabs.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => { selected = b.dataset.sel; store.set("mcs_sel", selected); render(); }));
  const m = machines[selected];
  $("upd").classList.add("hidden");
  $("single").classList.toggle("hidden", keys.length > 1);
  $("single").textContent = keys.length > 1 ? "" : (m.name || "");
  const showStale = !m.sim && stale;
  $("stale").classList.toggle("hidden", !showStale);
  if (showStale) $("stale").textContent = netDown
    ? "Téléphone sans Internet : les valeurs ci-dessous ne sont plus à jour. Elles reprendront seules au retour du réseau."
    : "Plus rien reçu de MCS Studio depuis " + (freshest < 60000 ? Math.round(freshest/1000) + " s" : ago(freshest)) + " : PC éteint, MCS Studio fermé ou pas d'Internet à l'atelier. Dernières valeurs reçues ci-dessous.";
  $("list").innerHTML = card(m, isStale(m));
  // Valeurs plus en direct (rien reçu depuis 12 s, téléphone hors ligne, machine muette) : grisées, pour ne pas les croire actuelles
  $("list").classList.toggle("old", notLive(m));
  fitText();
  drawChart(selected, chartPts(machines[selected]));
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => askAction(b.dataset.key, b.dataset.act)));
  document.querySelectorAll("[data-rap]").forEach(b => b.addEventListener("click", () => { const m = machines[b.dataset.rap]; const r = m && m.report && rapFind(m.report.file, m.sim); if (r) rapShow(r.id); }));
}
// Une ligne trop longue pour sa case (petit écran) est réduite jusqu'à tenir, au lieu d'être coupée par « … »
function fitText(){
  document.querySelectorAll(".step .box span:not(.sh)").forEach(x => {
    x.style.fontSize = ""; let f = parseFloat(getComputedStyle(x).fontSize);
    const over = () => { const r = document.createRange(); r.selectNodeContents(x); return r.getBoundingClientRect().width > x.getBoundingClientRect().width - 0.5 || x.scrollWidth > x.clientWidth; };
    while (over() && f > 7.5) { f -= 0.5; x.style.fontSize = f + "px"; }
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitText());
addEventListener("resize", () => fitText());
// Glisser à gauche / à droite pour changer de machine
(() => { let x0 = null, y0 = 0;
  document.addEventListener("touchstart", e => { if (e.target.closest(".modal") || e.target.closest("canvas")) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  document.addEventListener("touchend", e => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    const keys = Array.from(document.querySelectorAll("[data-sel]")).map(b => b.dataset.sel);
    const i = keys.indexOf(selected); if (i < 0) return;
    const j = i + (dx < 0 ? 1 : -1); if (j < 0 || j >= keys.length) return;
    selected = keys[j]; store.set("mcs_sel", selected); render();
  }, { passive:true });
})();
window.addEventListener("resize", () => scheduleRender());
// Fraîcheur des données, discrète, sur la ligne d'état : « en direct » ou « il y a 4 min »
// Courbe = graphe du cycle en cours reçu du PC ({cycle, pts}) + mesures en direct (toutes les 5 s) ajoutées au bout.
// Un graphe d'un autre cycle n'est jamais affiché : le n° de cycle doit être celui de l'état.
const live = {};
// Zoomé (27/11/2026) : graphe détaillé (jusqu'à 3000 points, envoyé par le PC toutes les 60 s), lu seulement pendant le zoom
let hdHists = {}, hdAt = {};
const zoomedNow = () => !!(tz[selected] && machines[selected]);
async function loadHd(k){
  if (!k || (hdAt[k] && Date.now() - hdAt[k] < 55000)) return;
  hdAt[k] = Date.now();
  try { const d = await dbGet("histhd/" + k); if (d && Array.isArray(d.pts)) { hdHists[k] = d; if (selected === k && machines[k]) drawChart(k, chartPts(machines[k])); } } catch(e){ hdAt[k] = 0; }
}
function chartPts(m){
  if (!m || !m.cycle) return null;
  const k = m.key;
  const hdz = zoomedNow() && hdHists[k] && hdHists[k].cycle === m.cycle && hdHists[k].pts.length > 1 ? hdHists[k] : null;
  if (zoomedNow()) loadHd(k);
  const hd = hdz || hists[k];
  const base = hd && hd.cycle === m.cycle && Array.isArray(hd.pts) ? hd.pts : [];
  const lv = live[k] && live[k].cycle === m.cycle ? live[k] : (live[k] = { cycle: m.cycle, pts: [] });
  const lastH = base.length ? base[base.length-1][0] : -1;
  lv.pts = lv.pts.filter(p => p[0] > lastH);
  if ((m.running || m.paused) && m.h != null && m.v != null && m.h > lastH && (!lv.pts.length || m.h > lv.pts[lv.pts.length-1][0] + 1e-7))
    lv.pts.push([m.h, m.v, m.a, m.t, m.stepNo || 0]);
  const all = base.concat(lv.pts);
  if (!hd || hd.cycle !== m.cycle) needHist();
  return all.length ? all : null;
}
let needTimer = null;
function needHist(){ if (!needTimer) needTimer = setTimeout(() => { needTimer = null; loadHist(); }, 1500); }
// Fraîcheur (26/11/2026) : jugée à l'heure de RÉCEPTION sur le téléphone, jamais à l'horloge du PC (elle peut avancer de
// plusieurs minutes et laissait « en direct » affiché après une coupure). Le PC envoie toutes les 5 s : plus rien depuis
// 12 s = plus en direct. Coupure Internet du téléphone détectée à part (hors ligne).
const LIVE_MS = 12000, STALE_MS = 30000; let pageStart = Date.now();
let rxAt = {}, rxUpd = {}, lastRxAny = 0, netDown = !navigator.onLine;
function noteRx(){
  const now = Date.now();
  for (const k in machines) {
    const m = machines[k]; if (!m || typeof m !== "object" || !m.updated) continue;
    if (rxUpd[k] === undefined) { rxUpd[k] = m.updated; continue; }           // première valeur : fraîcheur encore inconnue
    if (m.updated !== rxUpd[k]) { rxUpd[k] = m.updated; rxAt[k] = now; lastRxAny = now; }
  }
}
// Âge des dernières valeurs reçues (ms) ; au tout début, avant le 2e envoi du PC : estimé avec l'heure du PC
function rxAge(m){
  const k = m && m.key; if (!k) return Infinity;
  if (rxAt[k]) return Date.now() - rxAt[k];
  const est = Math.max(0, Date.now() - (m.updated || 0));
  return Date.now() - pageStart < LIVE_MS ? 0 : Math.max(est, Date.now() - pageStart);
}
function notLive(m){ return !!m.updated && (netDown || rxAge(m) > LIVE_MS || ((m.running || m.paused) && linkAge(m) > 15000)); }
function isStale(m){ return netDown || rxAge(m) > STALE_MS; }
// Liaison machine ↔ PC : les deux heures viennent du PC (pas d'écart d'horloge)
function linkAge(m){ return m && m.updated && m.lastSeen && m.updated - m.lastSeen > 0 ? m.updated - m.lastSeen + (rxAt[m.key] ? Date.now() - rxAt[m.key] : 0) : 0; }
function freshTxt(m){
  if (!m.updated) return '<span class="fresh"></span>';
  if (netDown) return '<span class="fresh bad"><span class="live"></span>téléphone hors ligne</span>';
  const age = rxAge(m);
  if (Date.now() - pageStart < LIVE_MS && !rxAt[m.key]) return '<span class="fresh">connexion…</span>';
  if (age > LIVE_MS) return '<span class="fresh bad"><span class="live"></span>reçu il y a ' + (age < 60000 ? Math.round(age/1000) + ' s' : ago(age)) + '</span>';
  const la = linkAge(m);
  if ((m.running || m.paused) && la > 15000) return '<span class="fresh bad"><span class="live"></span>machine muette ' + (la < 60000 ? Math.round(la/1000) + ' s' : ago(la)) + '</span>';
  return '<span class="fresh"><span class="live"></span>en direct</span>';
}
// Toutes les secondes : texte de fraîcheur à jour ; carte redessinée quand l'état bascule (boutons, bandeau)
let lastLiveSig = "";
setInterval(() => {
  if (!timer || document.hidden) return;
  const m = machines[selected]; if (!m) return;

  const hit = (r, w) => { const nw = normP(w); return (nw && (normP(r.pa).includes(nw) || normP(r.ot).includes(nw))) || String(r.ma || "").toUpperCase().includes(w) || (nw && normP(r.ma).includes(nw)); };
  const rows = rapVis().filter(r => (rapF === 0 || r.mc === machinesTxt[rapF]) && words.every(w => hit(r, w)));
  let h = '<div class="rcount">'+(rapLoading && !rapIdx ? "Chargement…" : (rapQ ? rows.length + ' rapport'+(rows.length > 1 ? 's' : '')+' pour « '+esc(rapQ)+' »' : rapVis().length.toLocaleString("fr-FR") + ' rapport' + (rapVis().length > 1 ? 's' : '')) + ' · disponibles même PC éteint')+'</div>'
    + '<div id="rapMsg"></div><div class="rlist">';
  if (!rapIdx && rapLoading) h += '<div class="rload">Chargement des rapports…</div>';
  else if (!rows.length) h += '<div class="rload">'+(rapQ ? 'Aucun rapport pour « '+esc(rapQ)+' »' : 'Aucun rapport archivé pour l\'instant.<br>Le PC les copie au fil de l\'eau (Paramètres › Rapports sur le téléphone).')+'</div>';
  let mon = "";
  rows.slice(0, 400).forEach(r => {
    const d = new Date(rapEnd(r)), mk = d.getFullYear() + "-" + d.getMonth();
    if (mk !== mon) { mon = mk; h += '<div class="rmon">'+MOIS[d.getMonth()]+' '+d.getFullYear()+'</div>'; }
    h += '<div class="ritem" data-id="'+esc(r.id)+'"><div class="d"><b>'+d.getDate()+'</b>'+MOISC[d.getMonth()]+'</div>'
      + '<div class="w"><b>'+esc([r.ma, r.pa].filter(Boolean).join(" ") || r.f.replace(/\.csv$/i, ""))+(r.sim ? '<span class="rsim">SIM</span>' : '')+'</b><span>'+esc([r.ot ? "OT " + r.ot : null, r.mc].filter(Boolean).join(" · "))+'</span></div>'
      + rapRowRight(r) + chev + '</div>';
  });
  if (rows.length > 400) h += '<div class="rnote">… '+(rows.length - 400)+' de plus : précisez la recherche.</div>';
  return h + '</div>';
}
function rapBindItems(v){
  v.querySelectorAll(".ritem[data-id]").forEach(b => {
    b.addEventListener("click", e => { if (rapHeld) { e.preventDefault(); rapHeld = false; return; } rapShow(b.dataset.id); });
    // Appui long (0,55 s sans bouger) : bulle « Supprimer » ; le doigt qui glisse (défilement) annule
    b.addEventListener("touchstart", e => {
      const t = e.touches[0]; b._x0 = t.clientX; b._y0 = t.clientY;
      clearTimeout(rapHoldT);
      rapHoldT = setTimeout(() => { rapHeld = true; b.classList.add("held"); rapPopShow(b.dataset.id, b._x0, b._y0); }, 550);
    }, { passive: true });
    b.addEventListener("touchmove", e => { const u = e.touches[0]; if (Math.hypot(u.clientX - b._x0, u.clientY - b._y0) > 10) clearTimeout(rapHoldT); }, { passive: true });
    b.addEventListener("touchend", () => clearTimeout(rapHoldT), { passive: true });
    b.addEventListener("contextmenu", e => e.preventDefault());
  });
}
let rapQT = null, rapHoldT = null, rapHeld = false, rapPopId = null;
function rapPopShow(id, x, y){
  rapPopId = id;
  const p = $("rapPop"); p.classList.remove("hidden");
  const w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(12, Math.min(innerWidth - w - 12, x - w / 2)) + "px";
  p.style.top = (y - h - 18 > 60 ? y - h - 18 : y + 18) + "px";   // au-dessus du doigt, sinon dessous
}
function rapPopHide(){ $("rapPop").classList.add("hidden"); document.querySelectorAll(".ritem.held").forEach(x => x.classList.remove("held")); rapPopId = null; }
document.addEventListener("touchstart", e => { if (!$("rapPop").classList.contains("hidden") && !e.target.closest("#rapPop")) { rapPopHide(); setTimeout(() => { rapHeld = false; }, 400); } }, { passive: true });
$("rapPopDel").addEventListener("click", () => { const id = rapPopId; rapPopHide(); rapHeld = false; if (id) askDelete(id); });
// Confirmation, comme pour Arrêter un cycle ; c'est le PC qui supprime (Corbeille de Windows + copie en ligne)
function askDelete(id){
  const r = (rapIdx || []).find(x => x.id === id); if (!r) return;
  const d = new Date(rapEnd(r));
  modalCtx = { key: null, act: "del", id };
  $("mList").classList.add("hidden"); $("mGo").className = "go"; $("mGo").disabled = false;
  $("mTitle").textContent = "Supprimer ce rapport ?";
  $("mText").textContent = ([r.ma, r.pa].filter(Boolean).join(" ") || r.f.replace(/\.csv$/i, "")) + (r.ot ? " · OT " + r.ot : "")
    + " · " + String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear()
    + ". Il sera supprimé du PC de l'atelier (Corbeille de Windows) et de l'appli.";
  $("mGo").textContent = "Supprimer";
  $("modal").classList.remove("hidden");
}
async function doDelete(id){
  const r = (rapIdx || []).find(x => x.id === id); if (!r) return;
  const key = Object.keys(machines)[0], at = pcNow(key);
  rapNote("Demande envoyée au PC de l'atelier…");
  try { await dbPut("delreq", { at, file: r.f, sim: !!r.sim }); }
  catch(e){ rapNote("⚠ Suppression impossible : " + friendly(e.message)); return; }
  for (let n = 0; n < 20; n++) {
    await new Promise(ok => setTimeout(ok, 1500));
    let c = null; try { c = await dbGet("delreq"); } catch(e){}
    if (c && c.at === at && c.result) {
      if (c.result === "ok") { rapIdx = (rapIdx || []).filter(x => x.id !== id); rapRefreshList(); rapNote("Rapport supprimé."); }
      else if (c.result === "fin de cycle") rapNote("Cycle en cours : le rapport sera supprimé à la fin du cycle.");
      else rapNote("⚠ " + c.result.charAt(0).toUpperCase() + c.result.slice(1) + ".");
      return;
    }
  }
  // Sans réponse : demande annulée, pour que rien ne soit supprimé plus tard sans qu'on s'y attende
  try { const c = await dbGet("delreq"); if (c && c.at === at && !c.result) await dbPut("delreq", { ...c, result: "annulé : pas de réponse de MCS Studio", done: Date.now() }); } catch(e){}
  rapNote("⚠ Pas de réponse du PC de l'atelier : suppression annulée. Vérifiez que le PC est allumé et MCS Studio ouvert.");
}
function rapRefreshList(){ const b = $("rapBody"); if (!b) return rapDraw(); b.innerHTML = rapListBody(); rapBindItems($("rapView")); }
function rapBatt(){
  const one = (rapIdx || []).find(r => r.id === rapParc) || {};
  const pas = one.pa ? (rapIdx || []).filter(r => sameParc(r.pa, one.pa) && r.sim === one.sim) : [one];
  pas.sort((a, b) => (a.d || 0) - (b.d || 0));
  const withPc = pas.filter(r => r.pc != null && !r.it).slice(-6);
  const last = withPc[withPc.length - 1], prev = withPc[withPc.length - 2];
  const dd = d => { const x = new Date(d || 0); return String(x.getDate()).padStart(2, "0") + "/" + String(x.getMonth() + 1).padStart(2, "0"); };
  let h = '<div class="rtop"><button class="back" data-r="list">‹ Rapports</button><h2>Batterie</h2></div><div class="rlist">'
    + '<div class="bhead"><b>'+esc([one.ma, one.pa].filter(Boolean).join(" ") || one.f)+'</b><span>'+esc([one.bt, pas.length + ' passage' + (pas.length > 1 ? 's' : '')].filter(Boolean).join(" · "))+'</span></div>';
  if (withPc.length) {
    h += '<div class="bars"><div class="th" style="bottom:80%"><i>seuil 80 %</i></div>'+withPc.map(r => '<div class="b'+(r === last ? ' cur' : '')+'" style="height:'+Math.max(2, Math.min(100, r.pc))+'%"><span>'+r.pc+' %</span></div>').join("")+'</div>'
      + '<div class="blab">'+withPc.map(r => '<span>'+dd(r.d)+(withPc.length <= 3 ? '/'+new Date(r.d || 0).getFullYear() : withPc.length <= 4 ? '/'+String(new Date(r.d || 0).getFullYear()).slice(2) : '')+'</span>').join("")+'</div>';
    if (prev) { const dlt = last.pc - prev.pc;
      h += '<div class="rnote" style="margin:0 0 6px;font-weight:600;color:var(--'+(last.pc >= 80 ? 'muted' : 'warn')+')">'+(dlt === 0 ? 'Stable' : (dlt > 0 ? '+' : '−') + Math.abs(dlt) + ' point' + (Math.abs(dlt) > 1 ? 's' : ''))+' depuis le passage du '+dd(prev.d)+(last.pc < 80 ? ' · sous le seuil de réforme' : '')+'</div>'; }
  }
  [...pas].reverse().forEach(r => {
    const d = new Date(r.d || 0), ds = dd(r.d) + "/" + d.getFullYear();
    const res = r.it ? '<em style="font-style:normal;color:var(--muted)">interrompu</em>' : r.pc != null ? '<em style="font-style:normal;color:var(--'+pcVar(r.pc)+')">'+(r.ah != null ? r.ah + ' Ah · ' : '')+r.pc+' %</em>' : '';
    h += '<div class="pitem"><div class="w"><b>'+ds+(res ? ' · ' + res : '')+'</b><span>'+esc([r.ot ? "OT " + r.ot : null, r.ma, r.au ? "autonomie " + r.au + (r.c5 ? " C5" : "") : r.mo, r.mc].filter(Boolean).join(" · "))+'</span></div>'
      + (r.pdf ? '<button class="pdf" data-pdf="'+esc(r.id)+'"><svg width="14" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>PDF</button>' : '')
      + '<button class="ml" data-mail="'+esc(r.id)+'" aria-label="Envoyer le rapport par mail"><svg width="20" height="15" viewBox="0 0 18 14" aria-hidden="true"><rect x="1" y="1" width="16" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.8 2l7.2 5.6L16.2 2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>';
  });
  return h + '<div id="rapMsg"></div></div>';
}
function rapDraw(){
  const v = $("rapView"); if (v.classList.contains("hidden")) return;
  const hadFocus = document.activeElement && document.activeElement.id === "rapSearch", sel = hadFocus ? document.activeElement.selectionStart : 0;
  v.innerHTML = rapScreen === "batt" ? rapBatt() : rapList();
  v.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { if (b.dataset.r === "close") rapClose(); else { rapScreen = "list"; rapDraw(); } }));
  v.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { rapF = +b.dataset.f; rapDraw(); }));
  const sb = $("rapSimBtn"); if (sb) sb.addEventListener("click", () => { rapSim = !rapSim; store.set("rap_sim", rapSim ? "1" : null); rapF = 0; rapDraw(); });
  rapBindItems(v);
  v.querySelectorAll("[data-pdf]").forEach(b => b.addEventListener("click", () => openPdf(b.dataset.pdf)));
  v.querySelectorAll("[data-mail]").forEach(b => b.addEventListener("click", () => rapMail(b.dataset.mail)));
  const si = $("rapSearch");
  if (si) {
    si.addEventListener("input", () => { rapQ = si.value; clearTimeout(rapQT); rapQT = setTimeout(rapRefreshList, 120); });
    if (hadFocus) { si.focus(); try { si.setSelectionRange(sel, sel); } catch(e){} }
  }
}
let rapToastT = null;
function rapNote(t){
  const n = $("rapMsg"); if (n) n.textContent = "";
  const el = $("rapToast"); if (!t || ($("rapView").classList.contains("hidden") && $("pdfView").classList.contains("hidden"))) { el.classList.add("hidden"); return; }
  if (t === rapNote.last) return; rapNote.last = t;
  el.textContent = t; el.className = /envoyé à|supprimé|fin du cycle/i.test(t) ? "ok" : /^⚠/.test(t) ? "bad" : "";
  clearTimeout(rapToastT);
  if (/envoyé à|supprimé|fin du cycle|^⚠/i.test(t)) rapToastT = setTimeout(() => el.classList.add("hidden"), 7000);
}
// Envoi par mail d'un rapport archivé : mêmes destinataires que sur le PC, c'est le PC qui envoie (il doit être joignable)
function rapMail(id){
  const r = (rapIdx || []).find(x => x.id === id); if (!r) return;
  // Destinataires du PC : « mail » (toujours envoyé par le PC depuis le 27/11/2026), sinon ceux du journal en cours
  const recipsOf = m => m && m.mail && m.mail.recips && m.mail.recips.length ? m.mail : m && m.report && m.report.recips && m.report.recips.length ? m.report : null;
  const key = Object.keys(machines).find(k => recipsOf(machines[k]) && !!machines[k].sim === !!r.sim && !isStale(machines[k]));
  if (!key) {
    // PC injoignable : envoi depuis le téléphone (26/11/2026). Rapport de simulation alors que le PC est ouvert en mode
    // atelier (ou l'inverse) : le PC est là, mais ce n'est pas lui qui a ce rapport → on le dit tel quel
    const other = Object.keys(machines).some(k => machines[k] && !!machines[k].sim !== !!r.sim && !isStale(machines[k]));
    rapShare(r, other ? (r.sim ? "MCS Studio n'est pas ouvert en simulation" : "MCS Studio est ouvert en simulation") : null); return;
  }
  const base = recipsOf(machines[key]), env = String(r.env || "").split(/\r?\n/).filter(Boolean).map(l => l.split("|"));
  const recips = base.recips.map(x => { const hit = env.filter(e => (e[1] || "").trim().toLowerCase() === String(x.mail).trim().toLowerCase()).pop();
    let last = null; if (hit) { const t = new Date(hit[0].replace(" ", "T")); if (!isNaN(t)) last = (w => w.charAt(0).toUpperCase() + w.slice(1))(t.toLocaleDateString("fr-FR", { weekday: "short" })) + " " + String(t.getDate()).padStart(2, "0") + "/" + String(t.getMonth() + 1).padStart(2, "0") + " " + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0"); }
    return { ...x, last }; });
  modalCtx = { key, act: "mail", fromRap: true };
  $("mList").classList.add("hidden"); $("mGo").className = "go"; $("mGo").disabled = false;
  askMail({ id: [r.ma, r.pa].filter(Boolean).join(" "), ot: r.ot, finished: null, report: { file: r.f, ok: base.ok, recips } });
  const d = new Date(r.d || 0); $("mText").textContent += (r.d ? " · cycle du " + String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear() : "");
}
// Envoi depuis le téléphone quand le PC n'est pas joignable : le PDF archivé est joint, le mail part de ce téléphone
let shareFile = null, shareText = "";
async function rapShare(r, why){
  modalCtx = { key: null, act: "share", fromRap: true };
  shareFile = null;
  const who = [r.ma, r.pa].filter(Boolean).join(" ");
  const subj = ["Rapport Régénération", r.ma, r.pa, r.ot ? "OT N°" + r.ot : null].filter(Boolean).join(" ");
  shareText = "Bonjour,\n\nVeuillez trouver ci-joint le rapport de régénération de la batterie.\n\n\nCordialement.";
  $("mTitle").textContent = "Envoyer depuis le téléphone";
  $("mText").textContent = (why || "Le PC de l'atelier n'est pas joignable") + ". Le rapport " + (who ? who + " " : "") + "partira de la messagerie de ce téléphone : choisissez Mail, puis le destinataire.";
  $("mList").classList.add("hidden");
  $("mGo").textContent = "Préparation du PDF…"; $("mGo").className = "go neutral"; $("mGo").disabled = true;
  $("modal").classList.remove("hidden");
  try {
    // PDF préparé avant l'appui (l'iPhone n'ouvre le partage que juste après un appui)
    const b64 = r.pdf ? await dbGet((r.sim ? "simReportFiles/" : "reportFiles/") + r.id + "/pdf") : null;
    if (!b64) throw new Error("rapport PDF absent");
    const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    shareFile = new File([bytes], r.f.replace(/\.csv$/i, ".pdf"), { type: "application/pdf" });
    shareFile._subject = subj;
    if (modalCtx && modalCtx.act === "share") { $("mGo").textContent = "Envoyer"; $("mGo").disabled = false; }
  } catch(e){ if (modalCtx && modalCtx.act === "share") { $("mGo").textContent = "Indisponible"; $("mText").textContent = "⚠ " + friendly(e.message); } }
}
async function doShare(){
  if (!shareFile) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [shareFile] })) { await navigator.share({ files: [shareFile], title: shareFile._subject, text: shareText }); rapNote("Rapport prêt dans la messagerie du téléphone."); return; }
  } catch(e){ if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(shareFile); a.download = shareFile.name; a.click();
  rapNote("⚠ Partage indisponible sur ce téléphone : le PDF a été téléchargé.");
}

// Lecteur PDF dans l'appli (pdf.js) : le vrai rapport, page par page, net au zoom ; « Partager » pour l'enregistrer ou l'envoyer
let pdfLib = null, pdfBlob = null, pdfName = "";
function loadPdfLib(){
  if (pdfLib) return Promise.resolve(pdfLib);
  return new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "pdfjs/pdf.min.js";   // pdf.js 3.11.174 (Mozilla, Apache 2.0), hébergé avec la page
    sc.onload = () => { pdfLib = window.pdfjsLib; pdfLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js"; ok(pdfLib); };
    sc.onerror = () => ko(new Error("lecteur PDF indisponible (pas d'Internet ?)")); document.head.appendChild(sc); });
}
let pdfId = null;
async function openPdf(id){
  const r = (rapIdx || []).find(x => x.id === id); if (!r) return;
  pdfId = id;
  const n = r.pa ? (rapIdx || []).filter(x => sameParc(x.pa, r.pa) && !!x.sim === !!r.sim).length : 1;
  $("pdfHist").textContent = "Historique de la batterie · " + n + " passages ›";
  $("pdfHist").classList.toggle("hidden", n < 2);
  pdfName = r.f.replace(/\.csv$/i, ".pdf");
  $("pdfTitle").textContent = [r.ma, r.pa].filter(Boolean).join(" ") || pdfName;
  $("pdfPages").innerHTML = '<div class="rload" style="margin-top:25vh">Chargement du rapport…</div>';
  $("pdfView").classList.remove("hidden");
  try {
    const [lib, b64] = await Promise.all([loadPdfLib(), dbGet((r.sim ? "simReportFiles/" : "reportFiles/") + id + "/pdf")]);
    if (!b64) throw new Error("rapport PDF absent");
    const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    pdfBlob = new Blob([bytes], { type: "application/pdf" });
    const doc = await lib.getDocument({ data: bytes }).promise;
    $("pdfPages").innerHTML = "";
    const w = $("pdfPages").clientWidth - 16, q = Math.min(4, (window.devicePixelRatio || 1) * 2);
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n), vp0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: w / vp0.width * q });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height; $("pdfPages").appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  } catch(e){ $("pdfPages").innerHTML = '<div class="rload" style="margin-top:25vh">⚠ '+esc(friendly(e.message))+'</div>'; }
}
$("pdfBack").addEventListener("click", () => { $("pdfView").classList.add("hidden"); $("pdfPages").innerHTML = ""; $("rapToast").classList.add("hidden"); });
$("pdfMail").addEventListener("click", () => { if (pdfId) rapMail(pdfId); });
$("pdfHist").addEventListener("click", () => { const id = pdfId; $("pdfView").classList.add("hidden"); $("pdfPages").innerHTML = ""; if (id) rapOpenFiche(id); });
$("pdfShare").addEventListener("click", async () => {
  if (!pdfBlob) return;
  const file = new File([pdfBlob], pdfName, { type: "application/pdf" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: pdfName }); return; } } catch(e){ if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(pdfBlob); a.download = pdfName; a.click();
});
$("rapBtn").addEventListener("click", rapOpen);

// ---------- démarrage ----------
(async () => {
  if (!store.get("mcs_refresh")) { showLogin(); return; }
  try { await ensureToken(); showApp(); } catch(e){ showLogin(); }
})();
