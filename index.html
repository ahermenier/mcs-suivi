<script>
// GitHub Pages garde la page 10 min en cache : à chaque ouverture, on relit la version en ligne (adresse unique = pas de cache)
// et on recharge aussitôt si elle est plus récente. Les mises à jour arrivent ainsi dès la publication.
(function(){
  try {
    var mine = document.querySelector('meta[name="mcs-build"]').content;
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
      var m = t.match(/name="mcs-build" content="([^"]+)"/);
      if (m && m[1] !== mine && m[1] !== '20261126185750') location.replace(location.pathname + '?b=' + m[1]);
    }).catch(function(){});
  } catch(e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Style « instrument » : filets fins, texte et chiffres en IBM Plex Sans Condensed (chiffres de largeur égale, zéro sans point : demande atelier 26/11).
   La couleur ne sert qu'à dire quelque chose : tension / courant / température, décharge / restauration, état. */
:root{--bg:#fff;--card:#fff;--ink:#1F2A37;--rule:#C9CED6;--line:#DDE1E6;--text:#1F2A37;--muted:#5E6875;--volt:#2F64A8;--amp:#B86A28;--temp:#7556A8;--ok:#178A4C;--okSoft:#EAF5EE;--warn:#8A5A00;--warnSoft:#FBF1DE;--danger:#C42F24;--dangerSoft:#FBEAE8;--blue:#1F5FA8;--ampCell:#F7E6D8;--voltCell:#E3EBF6;--sans:'IBM Plex Sans Condensed',system-ui,sans-serif;--mono:'IBM Plex Sans Condensed',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:#fff;color:var(--text);font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
/* iPhone (iOS 26) : le système floute une bande sous l'heure et la batterie, même hors de la barre d'état.
   Rien d'écrit dans cette bande : la page commence par les onglets, un peu plus bas ; « Mis à jour » passe en bas. */
#appView{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 12px calc(4px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 0;gap:8px;order:9}
header .sub{font-size:12px;color:var(--muted)}
.link{border:0;background:none;color:var(--muted);font:600 13px var(--sans);padding:6px 2px}
.topbar{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;border-bottom:1px solid var(--rule)}
.topbar .tabs{flex:1;margin:0}
.single{flex:1;font-size:19px;font-weight:700;padding:0 0 7px 0}
.out{flex:none;width:36px;height:38px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding:0 0 4px}
.tabs{display:flex;gap:0;min-width:0}
.tabs.many button{font-size:15px;gap:5px}.tabs.many .sim{font-size:10px}
@media (max-width:370px){.tabs.many button{font-size:13px;gap:3px;padding:0 1px}.tabs.many .dot{width:6px;height:6px}.tabs.many .sim{font-size:9px;letter-spacing:0}}
.fresh{font:400 12px var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap}
.tabs button{flex:1;min-width:0;border:0;background:none;border-radius:0;height:40px;font:600 17px var(--sans);color:#8A8A8A;display:flex;align-items:center;justify-content:flex-start;gap:7px;white-space:nowrap;overflow:hidden;padding:0 2px}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--blue)}
.tabs .sim{font:500 11px var(--mono);color:#8A8A8A;letter-spacing:.04em}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.card{flex:1;min-height:0;display:flex;flex-direction:column;padding:0}
.chartbox{flex:1;min-height:150px;margin-top:8px;position:relative}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-size:19px;font-weight:700}
.dot{width:8px;height:8px;display:inline-block;flex:none}
.state{display:flex;align-items:center;gap:7px;font:600 13.5px var(--sans);letter-spacing:.05em;text-transform:uppercase}
.simchip{font:500 11px var(--mono);letter-spacing:.06em;color:#8A5A00;border:1px solid #8A5A00;padding:0 5px}
.fresh .live{display:inline-block;width:6px;height:6px;background:var(--ok);margin-right:5px;vertical-align:1px}
.fresh.bad{color:var(--warn);font-weight:600}.fresh.bad .live{background:var(--warn)}
#list.old .band .v{opacity:.4}
.idl{font-size:14.5px;color:#444;margin-top:5px}
.idl b{color:var(--ink);font-weight:600}
.res{border-left:4px solid;padding:7px 10px;margin-top:9px}
.res .t{font-size:18px;font-weight:700}
.res .s{font:400 13px var(--sans);color:var(--muted);margin-top:1px}
.band{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:9px}
.band>div{padding:5px 8px 6px;border-left:1px solid var(--line);min-width:0}
.band>div:first-child{border-left:0;padding-left:0}
.band .l{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.band .v{font:600 28px var(--mono);letter-spacing:0;line-height:1.15;white-space:nowrap}
.band .v small{font:600 15px var(--sans);letter-spacing:0;margin-left:2px}
.band .c{font:400 11.5px var(--mono);color:#777}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fff;touch-action:pinch-zoom;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin-top:8px;align-items:stretch;border-top:1px solid var(--rule)}
.step{min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line);position:relative}
.step:first-child{border-left:0}
.step .box{flex:1;padding:6px 5px 5px;font:400 11px/1.3 var(--mono);color:#333;overflow:hidden;white-space:nowrap}
.step .box span{display:block;overflow:hidden;text-overflow:ellipsis}
.step .box .sh{display:flex;align-items:center;gap:3px;font:600 13.5px var(--sans);color:var(--ink);margin-bottom:1px}
.step .box .arr{flex:none}
.step .box b{font-weight:600}.step .box .real{color:#7A6050;font-size:.92em}
.step.next .box{color:#9A9A9A}.step.next .box .sh{color:#9A9A9A}
.step .bar{height:3px;border-radius:2px;background:#E3E6EA;margin:3px 4px 2px;overflow:hidden}
.step .bar i{display:block;height:100%;background:var(--ok)}
.times{display:flex;justify-content:space-between;font:400 13px var(--sans);color:#666;margin-top:0;padding-top:6px;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
.times b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;justify-content:center;margin-top:10px}
.acts button{width:45%;max-width:180px;height:42px;border-radius:4px;font:600 17px var(--sans);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--card);color:var(--text)}
.acts .stop{background:var(--danger);border-color:var(--danger);color:#fff}
.acts{gap:10px}
.acts .mail{width:42px;max-width:none;flex:none;padding:0;border-color:var(--blue);color:var(--blue);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.rcp{border-top:1px solid var(--line);margin-top:4px}
.rcp label{display:flex;align-items:center;gap:12px;margin:0;padding:11px 2px;border-bottom:1px solid var(--line);font:inherit;letter-spacing:0;text-transform:none;color:var(--ink)}
.rcp input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin:0}
.rcp .who{flex:1;min-width:0}.rcp .who b{display:block;font-size:16px;font-weight:600}
.rcp .who span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcp .st{font-size:12.5px;text-align:right;color:var(--muted);line-height:1.25;flex:none}.rcp .st.ok{color:var(--ok)}.rcp .st.ok b{font-weight:600}
.sheet .row2 .go:disabled{opacity:.4}
.note{font:400 13px var(--sans);margin-top:6px;color:var(--muted)}
.stale{background:var(--warnSoft);color:var(--warn);border-left:4px solid var(--warn);padding:8px 10px;font-size:13.5px;font-weight:600;margin:0 0 10px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:28px;font-weight:700;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.login p{color:var(--muted);font-size:14.5px;margin:8px 0 18px}
label{display:block;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
input{width:100%;height:46px;border:1px solid #C3C9D2;border-radius:3px;padding:0 12px;font:500 16px var(--sans);background:#fff;color:var(--text)}
input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.primary{width:100%;height:48px;border:0;border-radius:4px;background:var(--blue);color:#fff;font:600 17px var(--sans);letter-spacing:.04em;margin-top:18px}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:20px}
.empty{text-align:center;color:var(--muted);margin-top:20vh;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:700}
.sheet p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.pin{letter-spacing:12px;text-align:center;font-size:26px;font-weight:700}
.sheet .row2{display:flex;gap:8px;margin-top:14px}
.sheet .row2 button{flex:1;height:48px;border-radius:4px;font:600 17px var(--sans);border:1px solid #C3C9D2;background:#fff;color:var(--ink)}
.sheet .row2 .go{background:var(--danger);border-color:var(--danger);color:#fff}
.sheet .row2 .go.neutral{background:var(--blue);border-color:var(--blue)}
.hidden{display:none!important}
/* Bandeau du curseur quand on zoome (26/11/2026) : collé en haut de l'ÉCRAN, sous la zone floutée de l'iPhone, taille normale */
:root{--sat:env(safe-area-inset-top,0px)}
#curBar{position:absolute;left:0;top:0;z-index:30;transform-origin:0 0;background:#fff;border-bottom:1px solid var(--rule);
  padding:calc(var(--sat) + 30px) 14px 8px;box-shadow:0 2px 6px rgba(17,17,17,.08);pointer-events:none}
#curBar .t{font:600 15px var(--sans);color:var(--ink)}
#curBar .t span{color:var(--muted);font-weight:500}
#curBar .vals{display:flex;gap:18px;margin-top:3px;font:700 22px var(--sans);font-variant-numeric:tabular-nums}
#curBar .vals small{font-size:14px;margin-left:2px}
@media (max-height:720px){
  .res{padding:5px 8px;margin-top:7px}.res .t{font-size:16px}.res .s{font-size:12px}
  .band .v{font-size:21px}.band .v small{font-size:13px}.band .l,.band .c{font-size:10.5px}
  .chartbox{min-height:170px}
  .step .box{font-size:10px;min-height:30px;padding:4px 4px 3px}.step .box .sh{font-size:12.5px}
  .times{font-size:12px}.note{font-size:12px;margin-top:4px}
  .acts button{height:40px}
}
</style>

<body>

<section id="loginView" class="login hidden">
  <h1>MCS Suivi</h1>
  <p>Connexion une seule fois sur ce téléphone, avec le compte créé dans Firebase.</p>
  <form id="loginForm" method="post" action="#">
    <label for="email">Adresse mail</label>
    <input id="email" name="username" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" required>
    <label for="pass">Mot de passe</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="appView" class="hidden">
  <div class="topbar">
    <div id="tabs" class="tabs hidden"></div>
    <div id="single" class="single hidden"></div>
    <button class="out" id="logoutBtn" aria-label="Déconnexion" title="Déconnexion"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H4"/></svg></button>
  </div>
  <div class="sub hidden" id="upd"></div>
  <main>
    <div id="stale" class="stale hidden"></div>
    <div id="list" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
  </main>
</div>

<div id="curBar" class="hidden"></div>
<div id="modal" class="modal hidden">
  <div class="sheet">
    <h2 id="mTitle">Arrêter</h2>
    <p id="mText"></p>
    <div id="mList" class="rcp hidden"></div>

    <div class="row2"><button id="mCancel">Annuler</button><button id="mGo" class="go">Confirmer</button></div>
  </div>
</div>

<script>
const CFG = {
  apiKey: "AIzaSyD9wWBauLRixFVOsr8pLYfp-joWpVWfqts",
  db: "https://mcs-atelier-default-rtdb.europe-west1.firebasedatabase.app",
  idt: "https://identitytoolkit.googleapis.com", sec: "https://securetoken.googleapis.com"
};
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
};
let idToken = null, tokenUntil = 0, timer = null, machines = {}, pending = {};

// ---------- connexion (REST Firebase Auth) ----------
async function signIn(email, password){
  const r = await fetch(CFG.idt + "/v1/accounts:signInWithPassword?key=" + CFG.apiKey, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ email, password, returnSecureToken:true })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error && j.error.message || "Connexion refusée");
  idToken = j.idToken; tokenUntil = Date.now() + (parseInt(j.expiresIn)||3600)*1000 - 120000;
  store.set("mcs_refresh", j.refreshToken);
}
async function ensureToken(){
  if (idToken && Date.now() < tokenUntil) return;
  const rt = store.get("mcs_refresh");
  if (!rt) throw new Error("NOLOGIN");
  const r = await fetch(CFG.sec + "/v1/token?key=" + CFG.apiKey, {
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rt)
  });
  const j = await r.json();
  if (!r.ok) { store.set("mcs_refresh", null); throw new Error("NOLOGIN"); }
  idToken = j.id_token; tokenUntil = Date.now() + (parseInt(j.expires_in)||3600)*1000 - 120000;
  store.set("mcs_refresh", j.refresh_token);
}
async function dbGet(path){
  await ensureToken();
  const r = await fetch(CFG.db + "/" + path + ".json?auth=" + encodeURIComponent(idToken));
  if (r.status === 401) { idToken = null; throw new Error("Accès refusé"); }
  if (!r.ok) throw new Error("Erreur " + r.status);
  return r.json();
}
async function dbPut(path, value){
  await ensureToken();
  const r = await fetch(CFG.db + "/" + path + ".json?auth=" + encodeURIComponent(idToken), {
    method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(value)
  });
  if (!r.ok) throw new Error("Erreur " + r.status);
}

function friendly(msg){
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(msg)) return "Adresse ou mot de passe incorrect.";
  if (/TOO_MANY_ATTEMPTS/.test(msg)) return "Trop d'essais. Réessayez dans quelques minutes.";
  if (/Failed to fetch|NetworkError|Load failed/.test(msg)) return "Pas de connexion Internet.";
  return msg;
}

// ---------- écrans ----------
let loginFormHome = null, loginFormEl = null;
function showLogin(){
  if (!loginFormEl) loginFormEl = $("loginForm");
  if (loginFormHome && !loginFormEl.isConnected) { loginFormEl.querySelector("#pass").value = ""; loginFormHome.appendChild(loginFormEl); }
  $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden"); clearInterval(timer); timer = null; closeStream(); }
function showApp(){
  $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
  refresh(); loadHist(); openStream();
  // Filet de sécurité : relecture complète toutes les 30 s, graphes toutes les 60 s ; l'affichage vit surtout du flux en direct
  if (!timer) { timer = setInterval(() => { if (document.hidden) return; refresh(); if (++tick % 2 === 0) loadHist(); }, 30000); }
}
setInterval(() => { if (timer) scheduleRender(); }, 5000);
let tick = 0, es = null, esTimer = null, hists = {}, renderPending = false;
// Flux en direct Firebase (Server-Sent Events) : chaque envoi du PC (toutes les 5 s) arrive aussitôt
async function openStream(){
  closeStream();
  if (document.hidden) return;   // jamais de flux en arrière-plan
  try { await ensureToken(); } catch(e){ if (e.message === "NOLOGIN") showLogin(); return; }
  es = new EventSource(CFG.db + "/state.json?auth=" + encodeURIComponent(idToken));
  const onData = (e, merge) => {
    let d; try { d = JSON.parse(e.data); } catch(x){ return; }
    applyAt(d.path, d.data, merge); noteRx(); scheduleRender();
  };
  es.addEventListener("put", e => onData(e, false));
  es.addEventListener("patch", e => onData(e, true));
  es.addEventListener("auth_revoked", () => { idToken = null; openStream(); });
  es.addEventListener("cancel", () => { closeStream(); });
  es.onerror = () => { closeStream(); clearTimeout(esTimer); esTimer = setTimeout(openStream, 5000); };
  // Jeton valable 1 h : on rouvre le flux avec un jeton neuf avant qu'il expire
  clearTimeout(esTimer); esTimer = setTimeout(() => { idToken = null; openStream(); }, Math.max(60000, tokenUntil - Date.now()));
}
function closeStream(){ if (es) { es.close(); es = null; } }
function applyAt(path, data, merge){
  const parts = (path || "/").split("/").filter(Boolean);
  if (!parts.length) { machines = merge ? Object.assign(machines, data || {}) : (data || {}); return; }
  let o = machines;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (data == null) delete o[last];
  else if (merge && typeof o[last] === "object") Object.assign(o[last], data);
  else o[last] = data;
}
// Doigt posé sur le graphique : la page n'est pas reconstruite (sinon le graphique touché est remplacé et le curseur
// ne suit plus le doigt au bout de quelques secondes, constaté le 26/11/2026) ; mise à jour dès que le doigt est levé
let touching = false, renderWaiting = false;
function scheduleRender(){ if (touching) { renderWaiting = true; return; } if (renderPending) return; renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); }
async function loadHist(){ try { hists = await dbGet("hist") || {}; scheduleRender(); } catch(e){} }

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("loginBtn"), errEl = $("loginErr");   // références gardées : le formulaire peut sortir du DOM
  errEl.textContent = ""; btn.disabled = true; btn.textContent = "Connexion…";
  try {
    await signIn($("email").value.trim(), $("pass").value);
    // Trousseau iOS : Safari propose d'enregistrer quand le formulaire disparaît
    // après une connexion réussie, avec les champs encore remplis. On le retire
    // du DOM, puis on le remet vidé plus tard.
    const f = $("loginForm"), p = $("pass");
    loginFormEl = f; loginFormHome = f.parentNode; f.remove();
    showApp();
    setTimeout(() => { p.value = ""; }, 4000);
  }
  catch(err){ errEl.textContent = friendly(err.message); }
  finally { btn.disabled = false; btn.textContent = "Se connecter"; }
});
$("logoutBtn").addEventListener("click", () => { if (confirm("Se déconnecter de ce téléphone ?")) { store.set("mcs_refresh", null); idToken = null; showLogin(); } });
// Appli réduite : flux en direct coupé tout de suite (aucune consommation Firebase en arrière-plan), rouvert au retour
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { closeStream(); clearTimeout(esTimer); return; }
  // Retour au premier plan : fraîcheur remise à « connexion… » le temps du premier envoi (pas de faux « reçu il y a 10 min »)
  pageStart = Date.now(); rxAt = {}; rxUpd = {}; lastRxAny = 0;
  if (timer) { refresh(); loadHist(); if (!es) openStream(); }
});

// ---------- affichage ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (x, d) => x == null ? "–" : Number(x).toLocaleString("fr-FR", { minimumFractionDigits:d, maximumFractionDigits:d });
function stateStyle(m){
  const s = m.state || "";
  if (s === "En marche") return ["var(--ok)","var(--okSoft)","var(--ok)"];
  if (s === "En pause") return ["var(--warn)","var(--warnSoft)","var(--warn)"];
  if (s === "Terminé") return ["var(--ok)","var(--okSoft)","var(--ok)"];
  if (s.includes("erreur")) return ["var(--danger)","var(--dangerSoft)","var(--danger)"];
  if (s === "Hors ligne") return ["var(--warn)","var(--warnSoft)","var(--warn)"];
  return ["var(--muted)","#EEF1F5","var(--muted)"];
}

async function refresh(){
  try {
    const data = await dbGet("state") || {};
    machines = data; netDown = false;
    noteRx(); render();
  } catch(err){
    if (err.message === "NOLOGIN") { showLogin(); return; }
    $("upd").textContent = "⚠ " + friendly(err.message); $("upd").classList.remove("hidden");
  }
}

let selected = store.get("mcs_sel"), seenHistAt = {}, histLoading = false;
function render(){
  if (touching) { renderWaiting = true; return; }
  // Le PC signale un nouveau graphe (changement d'étape, fin de cycle, ou toutes les 60 s) : on le recharge aussitôt
  for (const k in machines) {
    const ha = machines[k] && machines[k].histAt;
    if (ha && ha !== seenHistAt[k]) { seenHistAt[k] = ha; if (!histLoading) { histLoading = true; setTimeout(() => { histLoading = false; loadHist(); }, 800); } }
  }
  const now = Date.now();
  // Simulateur fermé depuis plus de 10 min : son onglet disparaît s'il y a de vraies machines (26/11 : 4 onglets débordaient)
  const anyReal = Object.keys(machines).some(k => machines[k] && typeof machines[k] === "object" && !machines[k].sim);
  const keys = Object.keys(machines).filter(k => machines[k] && typeof machines[k] === "object"
    && !(anyReal && machines[k].sim && now - (machines[k].updated || 0) > 600000));
  // Atelier (vraies machines) d'abord ; le simulateur après. Chaque machine juge sa propre fraîcheur.
  keys.sort((a, b) => (machines[a].sim ? 1 : 0) - (machines[b].sim ? 1 : 0) || a.localeCompare(b));
  const real = keys.filter(k => !machines[k].sim);
  const freshest = real.length ? Math.min(...real.map(k => rxAge(machines[k]))) : 0;
  const stale = real.length > 0 && (netDown || freshest > STALE_MS);
  if (!keys.length) {
    $("tabs").classList.add("hidden"); $("single").classList.add("hidden");
    $("list").innerHTML = '<div class="empty">Aucune machine reçue pour l\'instant.<br>Vérifiez dans MCS Studio : Réglages › Suivi téléphone.</div>'; return;
  }
  // Machine affichée : celle choisie (mémorisée sur le téléphone), sinon la première en marche, sinon la première
  if (!selected || !machines[selected] || !keys.includes(selected)) {
    selected = keys.find(k => !machines[k].sim && (machines[k].running || machines[k].paused)) || keys[0];
  }
  const tabs = $("tabs");
  tabs.classList.toggle("hidden", keys.length < 2);
  tabs.classList.toggle("many", keys.length > 2);
  tabs.innerHTML = keys.map(k => {
    const m = machines[k], dot = stateStyle(m)[2];
    const short = (m.name || k).replace(/ · simulateur$/, "").replace(/^MCS /, "");
    return '<button data-sel="'+esc(k)+'" class="'+(k===selected?'on':'')+'"><span class="dot" style="background:'+dot+'"></span>'+(keys.length > 2 ? '' : 'MCS ')+esc(short)+(m.sim?' <span class="sim">SIM</span>':'')+'</button>';
  }).join("");
  tabs.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => { selected = b.dataset.sel; store.set("mcs_sel", selected); render(); }));
  const m = machines[selected];
  $("upd").classList.add("hidden");
  $("single").classList.toggle("hidden", keys.length > 1);
  $("single").textContent = keys.length > 1 ? "" : (m.name || "");
  const showStale = !m.sim && stale;
  $("stale").classList.toggle("hidden", !showStale);
  if (showStale) $("stale").textContent = netDown
    ? "Téléphone sans Internet : les valeurs ci-dessous ne sont plus à jour. Elles reprendront seules au retour du réseau."
    : "Plus rien reçu de MCS Studio depuis " + (freshest < 60000 ? Math.round(freshest/1000) + " s" : ago(freshest)) + " : PC éteint, MCS Studio fermé ou pas d'Internet à l'atelier. Dernières valeurs reçues ci-dessous.";
  $("list").innerHTML = card(m, isStale(m));
  // Valeurs plus en direct (rien reçu depuis 12 s, téléphone hors ligne, machine muette) : grisées, pour ne pas les croire actuelles
  $("list").classList.toggle("old", notLive(m));
  fitText();
  drawChart(selected, chartPts(machines[selected]));
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => askAction(b.dataset.key, b.dataset.act)));
}
// Une ligne trop longue pour sa case (petit écran) est réduite jusqu'à tenir, au lieu d'être coupée par « … »
function fitText(){
  document.querySelectorAll(".step .box span:not(.sh)").forEach(x => {
    x.style.fontSize = ""; let f = parseFloat(getComputedStyle(x).fontSize);
    const over = () => { const r = document.createRange(); r.selectNodeContents(x); return r.getBoundingClientRect().width > x.getBoundingClientRect().width - 0.5 || x.scrollWidth > x.clientWidth; };
    while (over() && f > 7.5) { f -= 0.5; x.style.fontSize = f + "px"; }
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitText());
addEventListener("resize", () => fitText());
// Glisser à gauche / à droite pour changer de machine
(() => { let x0 = null, y0 = 0;
  document.addEventListener("touchstart", e => { if (e.target.closest(".modal") || e.target.closest("canvas")) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  document.addEventListener("touchend", e => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    const keys = Array.from(document.querySelectorAll("[data-sel]")).map(b => b.dataset.sel);
    const i = keys.indexOf(selected); if (i < 0) return;
    const j = i + (dx < 0 ? 1 : -1); if (j < 0 || j >= keys.length) return;

})();
window.addEventListener("resize", () => scheduleRender());
// Fraîcheur des données, discrète, sur la ligne d'état : « en direct » ou « il y a 4 min »
// Courbe = graphe du cycle en cours reçu du PC ({cycle, pts}) + mesures en direct (toutes les 5 s) ajoutées au bout.
// Un graphe d'un autre cycle n'est jamais affiché : le n° de cycle doit être celui de l'état.
const live = {};
function chartPts(m){
  if (!m || !m.cycle) return null;
  const k = m.key, hd = hists[k];
  const base = hd && hd.cycle === m.cycle && Array.isArray(hd.pts) ? hd.pts : [];
  const lv = live[k] && live[k].cycle === m.cycle ? live[k] : (live[k] = { cycle: m.cycle, pts: [] });
  const lastH = base.length ? base[base.length-1][0] : -1;
  lv.pts = lv.pts.filter(p => p[0] > lastH);
  if ((m.running || m.paused) && m.h != null && m.v != null && m.h > lastH && (!lv.pts.length || m.h > lv.pts[lv.pts.length-1][0] + 1e-7))
    lv.pts.push([m.h, m.v, m.a, m.t, m.stepNo || 0]);

let needTimer = null;
function needHist(){ if (!needTimer) needTimer = setTimeout(() => { needTimer = null; loadHist(); }, 1500); }
// Fraîcheur (26/11/2026) : jugée à l'heure de RÉCEPTION sur le téléphone, jamais à l'horloge du PC (elle peut avancer de
// plusieurs minutes et laissait « en direct » affiché après une coupure). Le PC envoie toutes les 5 s : plus rien depuis
// 12 s = plus en direct. Coupure Internet du téléphone détectée à part (hors ligne).
const LIVE_MS = 12000, STALE_MS = 30000; let pageStart = Date.now();
let rxAt = {}, rxUpd = {}, lastRxAny = 0, netDown = !navigator.onLine;
function noteRx(){
  const now = Date.now();
  for (const k in machines) {
    const m = machines[k]; if (!m || typeof m !== "object" || !m.updated) continue;
    if (rxUpd[k] === undefined) { rxUpd[k] = m.updated; continue; }           // première valeur : fraîcheur encore inconnue
    if (m.updated !== rxUpd[k]) { rxUpd[k] = m.updated; rxAt[k] = now; lastRxAny = now; }
  }
}
// Âge des dernières valeurs reçues (ms) ; au tout début, avant le 2e envoi du PC : estimé avec l'heure du PC
function rxAge(m){
  const k = m && m.key; if (!k) return Infinity;

}

function linkAge(m){ return m && m.updated && m.lastSeen && m.updated - m.lastSeen > 0 ? m.updated - m.lastSeen + (rxAt[m.key] ? Date.now() - rxAt[m.key] : 0) : 0; }

  if (netDown) return '<span class="fresh bad"><span class="live"></span>téléphone hors ligne</span>';
  const age = rxAge(m);
  if (Date.now() - pageStart < LIVE_MS && !rxAt[m.key]) return '<span class="fresh">connexion…</span>';
  if (age > LIVE_MS) return '<span class="fresh bad"><span class="live"></span>reçu il y a ' + (age < 60000 ? Math.round(age/1000) + ' s' : ago(age)) + '</span>';
  const la = linkAge(m);
  if ((m.running || m.paused) && la > 15000) return '<span class="fresh bad"><span class="live"></span>machine muette ' + (la < 60000 ? Math.round(la/1000) + ' s' : ago(la)) + '</span>';

// Toutes les secondes : texte de fraîcheur à jour ; carte redessinée quand l'état bascule (boutons, bandeau)
let lastLiveSig = "";
setInterval(() => {
  if (!timer || document.hidden) return;
  const m = machines[selected]; if (!m) return;
  const el = document.querySelector(".card .fresh, .fresh"); if (el) el.outerHTML = freshTxt(m);
  const sig = netDown + "|" + isStale(m) + "|" + notLive(m);
  if (sig !== lastLiveSig) { lastLiveSig = sig; scheduleRender(); }
  // Plus rien reçu depuis 15 s alors que le réseau est là : on rouvre le flux (il peut rester figé après une coupure)
  if (!netDown && lastRxAny && Date.now() - lastRxAny > 15000 && Date.now() - (window._reopenAt || 0) > 15000) { window._reopenAt = Date.now(); openStream(); refresh(); }
}, 1000);
// Pincement pour zoomer : le graphique est redessiné à la nouvelle échelle (sinon il est agrandi comme une image, flou)
let zoomTimer = null, lastZoom = 1;
// Zoomé et déplacé avec le doigt : l'heure du curseur suit la partie visible
if (window.visualViewport) visualViewport.addEventListener("scroll", () => { if (cursor && machines[cursor.key]) drawChart(cursor.key, chartPts(machines[cursor.key])); });
if (window.visualViewport) visualViewport.addEventListener("resize", () => {
  if (Math.abs(visualViewport.scale - lastZoom) < 0.05) return;
  clearTimeout(zoomTimer); zoomTimer = setTimeout(() => { lastZoom = visualViewport.scale; if (selected && machines[selected]) drawChart(selected, chartPts(machines[selected])); }, 120);
});
window.addEventListener("offline", () => { netDown = true; scheduleRender(); });
window.addEventListener("online", () => { netDown = false; if (timer) { openStream(); refresh(); loadHist(); } scheduleRender(); });
function ago(ms){ const m = Math.round(ms/60000); return m < 60 ? m + " min" : Math.floor(m/60) + "h" + String(m%60).padStart(2,"0"); }

function card(m, stale){

  let h = '<div class="card">';
  // Le nom est déjà dans l'onglet : la carte commence directement par l'état
  h += '<div class="row">';
  h += '<span class="state" style="color:'+fg+'"><span class="dot" style="background:'+dot+'"></span>'+esc(m.state)+(active && m.kind ? ' · '+esc(m.kind) : '')+'</span>'+freshTxt(m)+(m.sim && !tabsShown ? '<span class="simchip">SIMULATION</span>' : '')+'</div>';
  const idp = [m.id ? '<b>'+esc(m.id)+'</b>' : '', m.ot ? 'OT N°'+esc(m.ot) : '', esc(m.battery||"")].filter(Boolean);
  if (idp.length) h += '<div class="idl">'+idp.join(' · ')+'</div>';

    const b = ok ? "var(--okSoft)" : err ? "var(--dangerSoft)" : "#F2F2F2";
    h += '<div class="res" style="border-left-color:'+c+';background:'+b+'"><div class="t">'+esc(m.result || m.state)+'</div><div class="s">'+esc(m.finishLine || ((m.kind||"Programme")+' '+(ok?'terminé':'arrêté')+' le '+m.finished.replace(' ',' à ')))+'</div></div>';
  }
  if (m.v != null) {
    h += '<div class="band"><div><div class="l">Tension</div><div class="v" style="color:var(--volt)">'+num(m.v,1)+'<small>V</small></div><div class="c">'+(active?'cons. '+num(m.setV,1):'&nbsp;')+'</div></div>';
    h += '<div><div class="l">Courant</div><div class="v" style="color:var(--amp)">'+num(m.a,1)+'<small>A</small></div><div class="c">'+(active?'cons. '+num(m.setA,1):'&nbsp;')+'</div></div>';
    h += '<div><div class="l">Température</div><div class="v" style="color:var(--temp)">'+(m.t==null?'–':(m.t>0?'+':'')+m.t+'<small>°C</small>')+'</div><div class="c">'+(active?'batterie':'&nbsp;')+'</div></div></div>';

      const bgc = later ? "transparent" : (s.dis ? "var(--ampCell)" : "var(--voltCell)"), col = s.dis ? "var(--amp)" : "var(--volt)";
      const fr = s.state === "done" ? 1 : s.state === "now" ? (s.frac||0) : 0;

// Flèche simple : vers le bas = décharge (orangé), vers le haut = restauration (bleu)
function arrow(dis){
  return '<svg class="arr" width="12" height="14" viewBox="0 0 12 14" aria-label="'+(dis?'Décharge':'Restauration')+'"><path d="'+(dis?'M6 1.5v10M2 7.5l4 4 4-4':'M6 12.5v-10M2 6.5l4-4 4 4')+'" stroke="'+(dis?'#B86A28':'#2F64A8')+'" stroke-width="2" fill="none" stroke-linecap="square"/></svg>';

// Graphique dessiné comme celui du PC : 3 bandes (tension 45 %, courant 33 %, température 22 %, écart 6 %),

const LANES = [["V",1,"#2F64A8",0.45],["A",2,"#B86A28",0.33],["°C",3,"#7556A8",0.22]], GAP = 0.035;

function drawChart(key, pts){

  g.font = "500 10.5px IBM Plex Sans Condensed, system-ui, sans-serif";

  { const tw = LANES.reduce((a, l) => a + l[3], 0), av = 1 - GAP * (LANES.length - 1);
    LANES.forEach(([unit, idx, , wgt], li) => { const hh = ph * av * wgt / tw, n = hh >= 150 ? 4 : hh >= 60 ? 2 : 1, [mn, mx] = laneRange(li, idx);

  const every = Math.max(1, Math.ceil((xmax / step + 1) / 6));   // au plus 6 libellés sur un téléphone

  const bandsY = []; { const tw = LANES.reduce((a, l) => a + l[3], 0), av = 1 - GAP * (LANES.length - 1); let ps = 0;
    LANES.forEach(l => { const hg = av * l[3] / tw; bandsY.push([padT + ph * ps, padT + ph * (ps + hg)]); ps += hg + GAP; }); }

  }
  // bandes
  const totalW = LANES.reduce((a, l) => a + l[3], 0), avail = 1 - GAP * (LANES.length - 1);
  let pos = 0; const pills = [], laneInfo = [];   // pastilles de valeur dessinées en dernier (par-dessus les séparateurs)
  LANES.forEach(([unit, idx, col, wgt], li) => {
    const hgt = avail * wgt / totalW, top = padT + ph * pos, bot = padT + ph * (pos + hgt); pos += hgt + GAP;
    const [mn, mx] = laneRange(li, idx);
    const Y = v => bot - (v - mn) / (mx - mn) * (bot - top);
    laneInfo.push({ unit, idx, col, Y, top, bot });
    const n = (bot - top) >= 150 ? 4 : (bot - top) >= 60 ? 2 : 1;
    g.font = "500 10.5px " + MONO; g.textAlign = "right"; g.textBaseline = "middle";
    for (let i = 0; i <= n; i++) {
      const y = top + (bot - top) * i / n;
      g.strokeStyle = grid; g.lineWidth = 1; g.beginPath(); g.moveTo(padL, y + 0.5); g.lineTo(W - padR, y + 0.5); g.stroke();
      g.fillStyle = col; g.fillText(axisLabel(mn, mx, i, n, unit), padL - 4, Math.min(Math.max(y, top + 6), bot - 6));   // reste dans sa bande : pas de chevauchement avec la bande voisine
    }
    const line = () => { g.beginPath(); let st = false; pts.forEach(p => { const v = p[idx]; if (v == null || isNaN(v)) return; const x = X(p[0]), y = Math.max(top, Math.min(bot, Y(v))); st ? g.lineTo(x, y) : g.moveTo(x, y); st = true; }); };
    line(); g.strokeStyle = col; g.lineWidth = 1.6; g.lineJoin = "round"; g.stroke();
    const lv = [...pts].reverse().find(p => p[idx] != null);
    if (lv) pills.push(() => {
      const lab = (unit === "°C" ? Math.round(lv[idx]) : num(lv[idx], unit === "V" ? 1 : 0)) + " " + unit;
      g.font = "600 11px " + MONO; const tw = g.measureText(lab).width;
      const vy = Math.max(top, Math.min(bot, Y(lv[idx])));
      const px = X(lastX); let lx = Math.min(px + 2, W - 1 - tw);   // à droite, calée sur le bord (déborde dans la marge droite)
      // Valeur au-dessus OU au-dessous de la courbe sur toute sa largeur, jamais traversée par elle (26/11/2026)
      let yMin = vy, yMax = vy;
      pts.forEach(p => { const v = p[idx]; if (v == null || isNaN(v)) return; const x = X(p[0]); if (x < lx - 3 || x > lx + tw + 3) return;
        const y = Math.max(top, Math.min(bot, Y(v))); yMin = Math.min(yMin, y); yMax = Math.max(yMax, y); });
      // Au-dessus ou au-dessous du point selon la courbe (26/11/2026) : courbe qui arrive d'en haut (elle descend) → valeur
      // dessous ; qui arrive d'en bas ou à plat → valeur dessus. Côté opposé s'il n'y a pas la place dans la bande.
      const up = yMin - 10, dn = yMax + 10, fromAbove = yMin < vy - 2 && yMax <= vy + 2;
      const fitsUp = up - 6 >= top, fitsDn = dn + 6 <= bot;
      let ly = fromAbove ? (fitsDn ? dn : fitsUp ? up : dn) : (fitsUp ? up : fitsDn ? dn : up);
      ly = Math.min(Math.max(ly, top + 7), bot - 7);
      g.fillStyle = col; g.fillRect(px - 2.5, vy - 2.5, 5, 5);
      g.textAlign = "left"; g.textBaseline = "middle"; g.lineJoin = "round"; g.lineWidth = 4; g.strokeStyle = "#fff"; g.strokeText(lab, lx, ly);
      g.fillStyle = col; g.fillText(lab, lx, ly);
    });
  });
  // étapes : séparateurs et pastilles
  const segs = []; let s0 = 0;
  for (let i = 1; i <= pts.length; i++) if (i === pts.length || pts[i][4] !== pts[s0][4]) { segs.push([pts[s0][0], i < pts.length ? pts[i][0] : pts[i-1][0], pts[s0][4]]); s0 = i; }
  g.setLineDash([3,3]); g.strokeStyle = "#8A94A3"; g.lineWidth = 1;
  segs.slice(1).forEach(sg => { const x = X(sg[0]); g.beginPath(); g.moveTo(x, padT - 4); g.lineTo(x, padT); g.stroke(); vline(x); });
  g.setLineDash([]);
  const info = m.steps || [];
  segs.forEach(sg => {
    if (!sg[2]) return;
    const st = info.find(x => x.slot === sg[2]) || {}, x0 = X(sg[0]), x1 = X(sg[1]);
    if (x1 - x0 < 14) return;
    const cx = (x0 + x1) / 2, dis = st.dis;
    g.fillStyle = dis ? "#B86A28" : "#2F64A8"; g.font = "600 11px " + MONO; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(String(st.no || sg[2]), cx, 11.5);
  });
  pills.forEach(f => f());
  // Curseur (26/11/2026) : doigt posé ou glissé sur le graphique → ligne verticale, point et valeur sur chaque courbe, heure
  cv._cur = { padL, pw, xmax };
  if (cursor && cursor.key === key) {
    const t = Math.max(0, Math.min(xmax, (cursor.x - padL) / pw * xmax));
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const cx = X(best[0]);
    // Zoomé : textes du curseur gardés à leur taille à l'écran, heure posée en haut de la partie VISIBLE du graphique
    const vv = window.visualViewport, zs = Math.max(1, (vv && vv.scale) || 1), k = 1 / zs;
    const rc = cv.getBoundingClientRect();
    const visTop = vv ? Math.max(0, vv.offsetTop - rc.top) : 0, visLeft = vv ? Math.max(0, vv.offsetLeft - rc.left) : 0;
    const visRight = vv ? Math.min(W, vv.offsetLeft + vv.width - rc.left) : W, visBot = vv ? Math.min(H, vv.offsetTop + vv.height - rc.top) : H;
    g.strokeStyle = "#1F2A37"; g.lineWidth = Math.max(0.6, k); g.setLineDash([]);
    laneInfo.forEach(l => { g.beginPath(); g.moveTo(cx + 0.5, l.top); g.lineTo(cx + 0.5, l.bot); g.stroke(); });
    const right = cx < padL + pw * 0.62;   // valeurs du côté où il y a de la place
    laneInfo.forEach(l => {
      const v = best[l.idx]; if (v == null || isNaN(v)) return;
      const y = Math.max(l.top, Math.min(l.bot, l.Y(v)));
      g.fillStyle = "#fff"; g.beginPath(); g.arc(cx, y, 4.5 * k, 0, 7); g.fill();
      g.fillStyle = l.col; g.beginPath(); g.arc(cx, y, 3.2 * k, 0, 7); g.fill();
      const lab = (l.unit === "°C" ? Math.round(v) : num(v, l.unit === "V" ? 1 : 0)) + " " + l.unit;
      g.font = "700 " + (13 * k) + "px " + MONO; const tw = g.measureText(lab).width;
      const lx = right ? cx + 8 * k : cx - 8 * k - tw, ly = Math.min(Math.max(y - 12 * k, l.top + 8 * k), l.bot - 8 * k);
      g.textAlign = "left"; g.textBaseline = "middle"; g.lineJoin = "round"; g.lineWidth = 4 * k; g.strokeStyle = "#fff"; g.strokeText(lab, lx, ly);
      g.fillStyle = l.col; g.fillText(lab, lx, ly);
    });
    curBarShow(zs > 1.05, best, m, laneInfo);
    if (zs > 1.05) return;   // zoomé : l'heure et les valeurs sont dans le bandeau du haut de l'écran
    // heure : depuis le départ, et heure du jour (calculée sur l'heure du PC)
    let tl = "+" + fmtH(best[0]);
    if (m.updated && m.h != null) { const d = new Date(m.updated - (m.h - best[0]) * 3600e3); tl = (d.toDateString() === new Date().toDateString() ? "Auj." : (w => w.charAt(0).toUpperCase() + w.slice(1))(d.toLocaleDateString("fr-FR", { weekday: "short" }))) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + "  ·  " + tl; }
    g.font = "600 " + (12 * k) + "px " + MONO; const tw = g.measureText(tl).width + 12 * k, bh = 19 * k;
    let bx = Math.max(padL, Math.min(W - padR - tw, cx - tw / 2));   // centrée sur la ligne du curseur
    // Zoomé : l'heure se met juste au-dessus du doigt (toujours à l'écran, jamais sous la bande floutée du haut de l'iPhone),
    // ou dessous si le doigt est tout en haut ; sans zoom : en haut du graphique comme avant
    let by = 2;
    // Zoomé : 120 px (à l'écran) au-dessus du doigt, hors de la main ; doigt trop haut → à côté du doigt, jamais dessous
    if (zs > 1.05 && cursor.y != null) {
      by = cursor.y - 120 * k;
      if (by < visTop + 50 * k) { by = cursor.y - bh / 2; bx = cx + 60 * k + tw <= W - padR ? cx + 60 * k : Math.max(padL, cx - 60 * k - tw); }
      by = Math.min(Math.max(2, by), H - bh - 2);
    }
    g.fillStyle = "#1F2A37"; roundRect(g, bx, by, tw, bh, 3 * k); g.fill();
    g.fillStyle = "#fff"; g.textAlign = "left"; g.textBaseline = "middle"; g.fillText(tl, bx + 6 * k, by + bh / 2 + 0.5 * k);
  }
}
function curTimeText(m, h){
  let tl = "+" + fmtH(h);
  if (m.updated && m.h != null) { const d = new Date(m.updated - (m.h - h) * 3600e3);
    tl = (d.toDateString() === new Date().toDateString() ? "Auj." : (w => w.charAt(0).toUpperCase() + w.slice(1))(d.toLocaleDateString("fr-FR", { weekday: "short" }))) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + '<span>  ·  ' + tl + '</span>'; }
  return tl;
}
// Bandeau collé à l'écran zoomé : position et échelle suivent le zoom (visualViewport), jamais dans la zone floutée
function curBarShow(on, best, m, lanes){
  const bar = $("curBar"), vv = window.visualViewport;
  if (!on || !best || !vv) { bar.classList.add("hidden"); return; }
  bar.innerHTML = '<div class="t">' + curTimeText(m, best[0]) + '</div><div class="vals">' + lanes.map(l => { const v = best[l.idx]; if (v == null || isNaN(v)) return "";
    return '<span style="color:' + l.col + '">' + (l.unit === "°C" ? Math.round(v) : num(v, l.unit === "V" ? 1 : 0)) + '<small>' + l.unit + '</small></span>'; }).join("") + '</div>';
  bar.style.width = (vv.width * vv.scale) + "px";
  bar.style.transform = "translate(" + vv.pageLeft + "px," + vv.pageTop + "px) scale(" + (1 / vv.scale) + ")";
  bar.classList.remove("hidden");
}
// Curseur : suit le doigt sur le graphique, s'efface 4 s après qu'on le lâche (ou d'un appui ailleurs)
let cursor = null, cursorTimer = null;
function cursorAt(e, cv){
  const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  cursor = { key: cv.id.slice(2), x: t.clientX - r.left, y: t.clientY - r.top };
  clearTimeout(cursorTimer); drawChart(cursor.key, chartPts(machines[cursor.key]));
}
function cursorOff(delay){
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => { const k = cursor && cursor.key; cursor = null; $("curBar").classList.add("hidden"); if (k && machines[k]) drawChart(k, chartPts(machines[k])); }, delay);
}
// un doigt = curseur ; deux doigts = zoom normal (le curseur s'efface)
document.addEventListener("touchstart", e => { const cv = e.target.closest && e.target.closest("canvas[id^='c_']"); if (cv && e.touches.length === 1) { touching = true; cursorAt(e, cv); } else { touching = false; if (cursor) cursorOff(0); } }, { passive: true });
const touchDone = () => { if (!touching) return; touching = false; if (renderWaiting) { renderWaiting = false; scheduleRender(); } };
document.addEventListener("touchcancel", () => { touchDone(); if (cursor) cursorOff(4000); }, { passive: true });
document.addEventListener("touchmove", e => { const cv = e.target.closest && e.target.closest("canvas[id^='c_']"); if (cv && e.touches.length === 1 && cursor) { e.preventDefault(); cursorAt(e, cv); } }, { passive: false });
document.addEventListener("touchend", e => { touchDone(); if (cursor) cursorOff(4000); }, { passive: true });
document.addEventListener("mousedown", e => { const cv = e.target.closest && e.target.closest("canvas[id^='c_']"); if (cv) { cursorAt(e, cv); cursorOff(4000); } });
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function fmtH(h){ const m = Math.round(h*60); if (h < 1) return h*3600 < 60 ? Math.round(h*3600) + "s" : Math.max(1, m) + "min"; return Math.floor(m/60) + "h" + String(m%60).padStart(2,"0"); }

// ---------- ordre : Arrêter seulement, avec confirmation (jamais de démarrage ni de pause à distance) ----------
let modalCtx = null;
function askAction(key, act){
  const m = machines[key]; if (!m) return;
  modalCtx = { key, act };
  $("mList").classList.add("hidden"); $("mGo").className = "go"; $("mGo").disabled = false;
  if (act === "mail") { askMail(m); return; }
  if (act !== "stop") return;
  $("mTitle").textContent = "Arrêter " + m.name + " ?";
  $("mText").textContent = "Le programme" + (m.id ? " de " + m.id : "") + " sera arrêté. Il ne pourra pas être relancé depuis le téléphone.";
  $("mGo").textContent = "Arrêter";
  $("modal").classList.remove("hidden");
}
$("mCancel").addEventListener("click", () => { $("modal").classList.add("hidden"); modalCtx = null; });
// Heure d'un ordre exprimée à l'horloge du PC (26/11/2026) : le PC refuse un ordre trop ancien, et l'horloge du PC de
// l'atelier peut avancer de plusieurs minutes sur celle du téléphone (« refusé : demande trop ancienne »). Le PC écrit son
// heure (« updated ») toutes les 5 s ; on s'y cale, à ±3 s près.
function pcNow(key){
  const m = machines[key], now = Date.now();
  const skew = m && m.updated && Math.abs(now - m.updated) > 15000 ? m.updated + 2500 - now : 0;
  return now + skew;
}
// ---------- envoi du rapport : choix parmi les destinataires réglés sur le PC, le PC envoie ----------
function askMail(m){
  const r = m.report;
  $("mTitle").textContent = "Envoyer le rapport";
  $("mText").textContent = [m.id, m.ot ? "OT " + m.ot : null, (m.running || m.paused) ? "cycle en cours : rapport à ce stade" : m.finished ? "fin " + m.finished.slice(0,5) + " " + m.finished.slice(11) : null].filter(Boolean).join(" · ") + (r.ok ? "" : " — boîte d'envoi non réglée sur le PC");
  $("mList").innerHTML = r.recips.map(x => '<label><input type="checkbox" value="'+x.i+'"><span class="who"><b>'+esc(x.name)+'</b><span>'+esc(x.mail)+'</span></span>'
    + (x.last ? '<span class="st ok"><b>envoyé</b><br>'+esc(x.last)+'</span>' : '<span class="st">jamais<br>envoyé</span>') + '</label>').join("");
  $("mList").classList.remove("hidden");
  $("mGo").textContent = "Envoyer"; $("mGo").className = "go neutral";
  const upd = () => { $("mGo").disabled = !r.ok || !$("mList").querySelector("input:checked"); };
  $("mList").querySelectorAll("input").forEach(i => i.addEventListener("change", upd)); upd();
  modalCtx.file = r.file;
  $("modal").classList.remove("hidden");
}
async function sendMail(key, file){
  const to = Array.from($("mList").querySelectorAll("input:checked")).map(i => +i.value);
  if (!to.length) return;
  const at = pcNow(key);
  pending[key] = "Demande envoyée au PC de l'atelier…"; render();
  try { await dbPut("mailreq/" + key, { at, file, to }); waitMail(key, at, 0); }
  catch(err){ pending[key] = "⚠ Envoi impossible : " + friendly(err.message); render(); }
}
async function waitMail(key, at, n){
  try {
    const c = await dbGet("mailreq/" + key);
    if (c && c.at === at && c.result) {
      if (c.result === "sending") pending[key] = "Le PC envoie le mail…";
      else {
        pending[key] = c.result === "ok" ? "Rapport envoyé à " + (c.names || "") + " (" + (c.sentAt || "") + ")." : "⚠ " + c.result.charAt(0).toUpperCase() + c.result.slice(1) + ".";
        render(); setTimeout(() => { delete pending[key]; refresh(); }, 15000); refresh(); return;
      }
      render();
    }
  } catch(e){}
  if (n >= 40) {
    // Sans réponse : demande annulée, pour qu'aucun mail ne parte plus tard sans qu'on s'y attende
    try { const c = await dbGet("mailreq/" + key); if (c && c.at === at && !c.result) await dbPut("mailreq/" + key, { ...c, result: "annulé : pas de réponse de MCS Studio", done: Date.now() }); } catch(e){}
    pending[key] = "⚠ Pas de réponse du PC de l'atelier. Demande annulée : vérifiez que le PC est allumé et MCS Studio ouvert."; render(); return; }
  setTimeout(() => waitMail(key, at, n+1), 1500);
}
$("mGo").addEventListener("click", async () => {
  const { key, act } = modalCtx; $("modal").classList.add("hidden");
  if (act === "mail") { sendMail(key, modalCtx.file); return; }
  const at = pcNow(key);
  pending[key] = "Ordre envoyé, en attente de MCS Studio (jusqu'à 20 s)…"; render();
  try {
    await dbPut("commands/" + key, { cmd: act, at });
    waitResult(key, at, 0);
  } catch(err){ pending[key] = "⚠ Envoi impossible : " + friendly(err.message); render(); }
});
async function waitResult(key, at, n){
  try {
    const c = await dbGet("commands/" + key);
    if (c && c.at === at && c.result) {
      pending[key] = c.result === "ok" ? "Fait. MCS Studio a transmis l'ordre à la machine." : "⚠ " + c.result.charAt(0).toUpperCase() + c.result.slice(1) + ".";
      render(); setTimeout(() => { delete pending[key]; refresh(); }, 15000); refresh(); return;
    }
  } catch(e){}
  if (n >= 15) {
    // Sans réponse : l'ordre est annulé, pour qu'il ne s'exécute jamais plus tard sans qu'on s'y attende
    try { await dbPut("commands/" + key, { cmd: "stop", at, result: "annulé : pas de réponse de MCS Studio", done: Date.now() }); } catch(e){}
    pending[key] = "⚠ Pas de réponse de MCS Studio : ordre annulé. Vérifiez que le PC de l'atelier est allumé."; render(); return;
  }
  setTimeout(() => waitResult(key, at, n+1), 3000);
}

// ---------- démarrage ----------
(async () => {
  if (!store.get("mcs_refresh")) { showLogin(); return; }
  try { await ensureToken(); showApp(); } catch(e){ showLogin(); }
})();
</script>
